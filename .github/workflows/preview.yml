# Publishes every commit pushed to a branch of this repository to pkg.pr.new, a preview build with
# no release:
#   npx https://pkg.pr.new/reeval-ai/reeval/reeval@<sha> run
# It's the tarball ci.yml's packed install publishes, as version 0.0.0-preview-<full sha>, so no
# lockfile mistakes it for a release, and a bundle it makes names the commit it was built from.
# Only pushes here publish: a PR's branch is published by its push, and a fork's isn't.
# Needs the pkg.pr.new GitHub App on the repository.
name: preview

on:
  push:
    branches: ['**']

permissions:
  contents: read

# Every commit on main keeps its preview; a branch's newer push replaces its last.
concurrency:
  group: preview-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: pkg.pr.new
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: |
          node scripts/sandbox-images.mjs --registry ghcr.io/reeval-ai/sandbox \
            --digests packages/reeval/dist/image-digests.json
      - working-directory: packages/reeval
        run: |
          npm version --no-git-tag-version "0.0.0-preview-$GITHUB_SHA"
          pnpm pack --pack-destination "$RUNNER_TEMP/preview"
      - run: pnpm exec pkg-pr-new publish --bin --commentWithSha --no-template "$RUNNER_TEMP"/preview/*.tgz
